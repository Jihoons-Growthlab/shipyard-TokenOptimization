[project]
name = "shipyard-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi~=0.162.0",
  "uvicorn~=0.54.0",
  "pyjwt~=2.15.0",
  "argon2-cffi~=25.1.0",
  "python-multipart>=0.0.20",
]

[project.scripts]
init-db = "app.cli:main"

[dependency-groups]
dev = ["pytest~=9.2.0", "httpx~=0.28.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
